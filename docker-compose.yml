services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: personalos
      POSTGRES_USER: personalos
      POSTGRES_PASSWORD: change-this-db-password
    volumes: [personales_pg:/var/lib/postgresql/data]
  web:
    build: .
    restart: unless-stopped
    depends_on: [db]
    ports: ["5000:5000"]
    environment:
      DATABASE_URL: postgresql+psycopg://personalos:change-this-db-password@db:5432/personalos
      SECRET_KEY: replace-with-a-long-random-secret
      ADMIN_USERNAME: maike
      ADMIN_PASSWORD: replace-with-a-strong-password
      COOKIE_SECURE: "0"
volumes:
  personales_pg:

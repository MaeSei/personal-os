{% extends "base.html" %}{% block content %}<section class="hero small"><div><p class="eye">ITEM</p><h1>{{item.title}}</h1></div></section><section class="panel narrow"><form class="form" method="post" action="/items/{{item.id}}/update"><label>Title<input name="title" value="{{item.title}}" required></label><div class="three"><label>Kind<select name="kind">{% for v in kinds %}<option {% if item.kind==v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>State<select name="state">{% for v in states %}<option {% if item.state==v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>Context<select name="context">{% for v in contexts %}<option {% if item.context==v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label></div><label>Next physical action<input name="next_action" value="{{item.next_action or ''}}"></label><label>Blocked because<input name="blocker" value="{{item.blocker or ''}}"></label><label>Parent<select name="parent_id"><option value="">— none —</option>{% for p in parents %}<option value="{{p.id}}" {% if item.parent_id==p.id %}selected{% endif %}>{{p.title}}</option>{% endfor %}</select></label><label>Notes<textarea name="notes" rows="6">{{item.notes or ''}}</textarea></label><label class="check"><input type="checkbox" name="is_today" {% if item.is_today %}checked{% endif %}> Include in Today</label><button>Save</button></form></section>{% endblock %}

<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2d4a3a">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<title>PersonalOS</title><link rel="stylesheet" href="/static/app.css"></head><body>
<header><div><a href="/" class="brand">PersonalOS</a><span class="tag">Capture → Clarify → Choose → Close</span></div>
{% if session.get("user_id") %}<nav><a href="/">Mission Control</a><a href="/inbox">Inbox</a><a href="/projects">Projects</a><a href="/changes">Changes</a><form method="post" action="/logout"><button class="nav">Log out</button></form></nav>{% endif %}</header>
<main>{% with m=get_flashed_messages() %}{% for x in m %}<div class="flash">{{x}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js"));</script></body></html>

<article class="card state-{{i.state}}"><div class="top"><a href="/items/{{i.id}}"><strong>{{i.title}}</strong></a><span class="pill">{{i.state.replace('_',' ')}}</span></div><p class="muted">{{i.context}} · {{i.kind}}</p>{% if i.next_action %}<p class="next">Next → {{i.next_action}}</p>{% endif %}{% if i.blocker %}<p class="blocked">Blocked → {{i.blocker}}</p>{% endif %}<div class="actions"><form method="post" action="/items/{{i.id}}/today"><button class="ghost">{% if i.is_today %}Remove today{% else %}Today{% endif %}</button></form>{% if i.state!="done" %}<form method="post" action="/items/{{i.id}}/done"><button class="ghost">Done</button></form>{% endif %}</div></article>
